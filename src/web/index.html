<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Сеансы Claude</title>
<style>
  :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e3e8; --accent: #0a64d6;
          --working: #0066cc; --waiting: #107c10; --permission: #ca5010; --error: #c42b1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #a1a1a6; --border: #2e2e33; --accent: #4c9bff;
          --working: #4c9bff; --waiting: #4cc24c; --permission: #ff9a4c; --error: #ff6b5e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .banner { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .banner h2 { font-size: 16px; margin: 0 0 6px; }
  .banner p { margin: 0 0 10px; color: var(--muted); }
  .banner ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
  textarea { width: 100%; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 10px; border-radius: 8px; resize: none;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); padding: 9px 4px; }
  .device { margin: 22px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .s { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .project { font-weight: 600; }
  .state { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .working { color: var(--working); } .waiting { color: var(--waiting); } .permission { color: var(--permission); } .error { color: var(--error); }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
  .preview { color: var(--muted); font-size: 14px; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .offline { color: var(--error); }
  .details { color: var(--muted); font-size: 13px; margin-top: 6px; white-space: pre-line; }
  .req { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--bg); }
  .req-title { font-weight: 600; }
  .req-detail { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 5.6em; overflow: hidden; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .acts button { padding: 7px 14px; border-radius: 999px; font-size: 14px; }
  .acts .sec { background: var(--border); color: var(--text); }
  .acts .danger { background: var(--border); color: var(--error); }
  .reply { display: flex; gap: 8px; margin-top: 8px; }
  .reply input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  [hidden] { display: none !important; }

  /* --- Движение и отклик (modern-web-design): анимируются только transform и opacity --- */
  :root { --fast: 150ms; --normal: 250ms; --ease: cubic-bezier(.4, 0, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
          --e1: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); --e2: 0 8px 24px rgba(0,0,0,.10); --glass: rgba(245,245,247,.72); }
  @media (prefers-color-scheme: dark) { :root { --e1: 0 1px 3px rgba(0,0,0,.4); --e2: 0 8px 24px rgba(0,0,0,.5); --glass: rgba(17,17,19,.72); } }
  main { padding-top: 0; }
  header { position: sticky; top: 0; z-index: 5; margin: 0 -16px 16px; padding: 16px 16px 12px; background: var(--glass);
           -webkit-backdrop-filter: blur(10px) saturate(180%); backdrop-filter: blur(10px) saturate(180%); border-bottom: 1px solid var(--border); }
  .s { box-shadow: var(--e1); transition: box-shadow var(--normal) var(--ease); }
  .s.need { border-color: var(--permission); }
  .s.enter { animation: enter var(--normal) var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  .state.working::before { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .3; } }
  .ctx { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .ctx i { display: block; height: 100%; border-radius: 2px; background: var(--working); transform-origin: left; transform: scaleX(var(--p)); transition: transform var(--normal) var(--ease); }
  .ctx.warn i { background: var(--permission); } .ctx.full i { background: var(--error); }
  details.more { margin-top: 6px; }
  details.more summary { color: var(--accent); font-size: 13px; cursor: pointer; list-style: none; min-height: 32px; display: flex; align-items: center; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more .details { margin-top: 0; }
  button { min-height: 44px; transition: transform var(--fast) var(--spring), opacity var(--fast) var(--ease); }
  .acts button { min-height: 44px; }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .skeleton { height: 88px; border-radius: 12px; margin-bottom: 8px; background: linear-gradient(90deg, var(--card) 0%, var(--border) 50%, var(--card) 100%);
              background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Сеансы Claude</h1>
    <span class="sub" id="status" role="status" aria-live="polite">ПК __PCNAME__</span>
  </header>

  <section class="banner" id="mac" hidden>
    <h2>Показывать здесь сеансы этого Mac</h2>
    <p>Установите хуки Claude Code на этот Mac — одна команда в Терминале.</p>
    <div id="mac-step1"><button id="mac-get">Получить команду установки</button></div>
    <div id="mac-step2" hidden>
      <textarea id="mac-cmd" rows="2" readonly></textarea>
      <div class="row" style="margin-top:8px"><button id="mac-copy">Скопировать</button><span class="sub" id="mac-copied"></span></div>
      <ol>
        <li>Откройте Терминал: ⌘ + Пробел, наберите «Терминал», Enter.</li>
        <li>Вставьте команду (⌘ V) и нажмите Enter.</li>
        <li>Команда действует 10 минут и только один раз.</li>
      </ol>
    </div>
  </section>

  <div id="list" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div></div>
</main>
<script>
(function () {
  var list = document.getElementById('list'), status = document.getElementById('status');
  var me = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Новые карточки появляются плавно (первый раз — по очереди, с шагом 40 мс); уже виденные — без анимации.
  var seen = {}, firstRender = true, openDetails = {};
  function render(data) {
    list.textContent = '';
    list.removeAttribute('aria-busy');
    var waiting = data.sessions.filter(function (s) { return s.state === 'permission' || s.state === 'error' || s.state === 'waiting'; }).length;
    document.title = (waiting ? '(' + waiting + ') ' : '') + 'Сеансы Claude';
    if (!data.sessions.length) { list.appendChild(el('div', 'empty', 'Активных сеансов нет')); firstRender = false; return; }
    var n = 0;
    var groups = {}, order = [];
    data.sessions.forEach(function (s) {
      var key = s.device || 'local';
      if (!groups[key]) { groups[key] = { name: s.device_name, items: [] }; order.push(key); }
      groups[key].items.push(s);
    });
    order.forEach(function (key) {
      var g = groups[key];
      list.appendChild(el('div', 'device', g.name));
      g.items.forEach(function (s) {
        var card = el('div', 's' + (s.request ? ' need' : '')), row = el('div', 'row');
        if (!seen[s.id]) { card.className += ' enter'; if (firstRender) card.style.animationDelay = (n * 40) + 'ms'; seen[s.id] = true; }
        n++;
        row.appendChild(el('span', 'project', (s.pinned ? '\uD83D\uDCCC ' : '') + (s.title || s.project || '(без проекта)')));
        row.appendChild(el('span', 'state ' + s.state, s.state_text));
        row.appendChild(el('span', 'meta', s.elapsed + (s.origin === 'desktop' ? ' · приложение' : ' · терминал') +
          (s.context >= 0 ? ' · контекст ' + s.context + ' %' : '')));
        card.appendChild(row);
        if (s.context >= 0) {
          var bar = el('div', 'ctx' + (s.context >= 95 ? ' full' : (s.context >= 85 ? ' warn' : ''))), fill = el('i');
          fill.style.setProperty('--p', Math.min(100, s.context) / 100);
          bar.appendChild(fill); bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-label', 'Контекст ' + s.context + ' %');
          card.appendChild(bar);
        }
        if (s.preview) card.appendChild(el('div', 'preview', s.preview));
        if (s.details) {
          // Подробности свёрнуты; раскрытые остаются раскрытыми после обновления списка.
          var more = el('details', 'more'), sum = el('summary', null, 'Подробности');
          more.open = !!openDetails[s.id];
          more.addEventListener('toggle', (function (id) { return function () { openDetails[id] = this.open; }; })(s.id));
          more.appendChild(sum); more.appendChild(el('div', 'details', s.details));
          card.appendChild(more);
        }
        if (s.request) card.appendChild(requestBox(s));
        else if (s.can_reply) card.appendChild(replyBox(s));
        list.appendChild(card);
      });
    });
    firstRender = false;
  }

  function post(url, body, done) {
    fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (r.status === 410) alert('Уже решено в Claude'); if (done) done(); load(); });
  }
  function btn(text, cls, onclick) { var b = el('button', cls, text); b.onclick = onclick; return b; }

  // Запрос разрешения, вопрос Claude или утверждение плана — кнопками.
  function requestBox(s) {
    var r = s.request, box = el('div', 'req'), acts = el('div', 'acts');
    box.appendChild(el('div', 'req-title', r.title));
    if (r.detail) box.appendChild(el('div', 'req-detail', r.detail));
    function decide(behavior, answer) { return function () { post('/api/decision', { id: r.id, behavior: behavior, answer: answer || '' }); }; }
    if (r.kind === 'question') {
      r.options.forEach(function (o, i) { acts.appendChild(btn(o, i === 0 ? '' : 'sec', decide('allow', o))); });
      acts.appendChild(btn('Свой ответ…', 'sec', function () { var t = prompt(r.title); if (t) decide('allow', t)(); }));
    } else if (r.kind === 'plan') {
      acts.appendChild(btn('Утвердить', '', decide('allow')));
      acts.appendChild(btn('Отклонить', 'danger', decide('deny')));
    } else if (r.kind === 'tool') {
      acts.appendChild(btn('Разрешить', '', decide('allow')));
      if (r.can_always) acts.appendChild(btn('Разрешать всегда', 'sec', decide('always')));
      acts.appendChild(btn('Запретить', 'danger', decide('deny')));
    }
    box.appendChild(acts);
    return box;
  }

  // Быстрый ответ сеансу, который закончил и ждёт вас.
  function replyBox(s) {
    var box = el('div', 'req'), acts = el('div', 'acts'), row = el('div', 'reply');
    box.appendChild(el('div', 'req-title', 'Быстрый ответ'));
    ['Продолжай', 'Да', 'Нет'].forEach(function (q) { acts.appendChild(btn(q, 'sec', function () { post('/api/reply', { session: s.id, text: q }); })); });
    var input = document.createElement('input'); input.placeholder = 'Ответить Claude…';
    var send = btn('Отправить', '', function () { if (input.value.trim()) post('/api/reply', { session: s.id, text: input.value }); });
    input.onkeydown = function (e) { if (e.key === 'Enter') send.onclick(); };
    row.appendChild(input); row.appendChild(send);
    box.appendChild(acts); box.appendChild(row);
    return box;
  }

  var typing = false;
  document.addEventListener('focusin', function (e) { typing = e.target.tagName === 'INPUT'; });
  document.addEventListener('focusout', function () { typing = false; });

  function load() {
    fetch('/api/sessions', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { location.reload(); return null; }
      return r.json();
    }).then(function (data) {
      if (!data) return;
      render(data);
      status.className = 'sub';
      status.textContent = 'ПК ' + data.pc + ' · обновлено ' + new Date().toLocaleTimeString('ru-RU');
    }).catch(function () {
      status.className = 'sub offline';
      status.textContent = 'Нет связи с ПК — повторяю…';
    });
  }

  function isMac() { return /Macintosh/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1); }

  fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
    me = m;
    if (m && !m.hooks && isMac()) document.getElementById('mac').hidden = false;
  });

  document.getElementById('mac-get').onclick = function () {
    fetch('/api/install-link', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('mac-cmd').value = d.command;
      document.getElementById('mac-step1').hidden = true;
      document.getElementById('mac-step2').hidden = false;
      copy();
    });
  };

  function copy() {
    // По http:// (не https) navigator.clipboard недоступен — копируем через выделение.
    var t = document.getElementById('mac-cmd'), done = false;
    t.focus(); t.select();
    try { done = document.execCommand('copy'); } catch (e) { }
    document.getElementById('mac-copied').textContent = done ? 'Скопировано' : 'Выделите и скопируйте ⌘ C';
  }
  document.getElementById('mac-copy').onclick = copy;

  load();
  setInterval(function () { if (!typing) load(); }, 3000);
})();
</script>
</body>
</html>
