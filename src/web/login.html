<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Подключение · Claude Notifier</title>
<style>
  :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0a64d6; --error: #c42b1c; --border: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #a1a1a6; --accent: #4c9bff; --error: #ff6b5e; --border: #38383d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); }
  input { width: 100%; font-size: 32px; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 12px;
          border: 1px solid var(--border); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; margin-top: 14px; padding: 13px; font-size: 17px; font-weight: 600; border: 0; border-radius: 12px;
           background: var(--accent); color: #fff; cursor: pointer; }
  .msg { color: var(--error); margin: 14px 0 0; min-height: 1em; }
  .hint { font-size: 14px; margin: 18px 0 0; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1>Claude Notifier</h1>
  <p>Подключение к ПК <b>__PCNAME__</b>. Введите код из окна «Подключить устройство» на ПК.</p>
  <input name="pin" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" placeholder="000000" autofocus required aria-label="Код подключения">
  <button type="submit">Подключить</button>
  <p class="msg" role="alert">__MESSAGE__</p>
  <p class="hint">Устройство запомнится: в следующий раз код не понадобится.</p>
</form>
</body>
</html>
